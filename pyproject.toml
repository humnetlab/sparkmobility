[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "sparkmobility"
version = "0.1.0"
description = "Human mobility modeling with Spark and the TimeGeo simulator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

authors = [
  { name = "Shangqing Cao", email = "caoalbert@berkeley.edu" }
]

dependencies = [
  "branca>=0.7",
  "censusdis>=1.4.0",
  "folium>=0.20.0",
  "geopandas>=1.0.1",
  "geopy>=2.4.1",
  "h3>=4.1",
  "h3spark>=0.0.4",
  "matplotlib>=3.8.4",
  "numpy>=1.26.4",
  "pandas>=2.2",
  "powerlaw>=1.5",
  "pyarrow>=14.0.2",
  "pyproj>=3.6.1",
  "pyspark>=3.5.1",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "seaborn>=0.13",
  "shapely>=2.0",
  "statsmodels>=0.14.4",
  "tqdm>=4.66.4",
]

[project.optional-dependencies]
dev = [
  "black>=24.10",
  "isort>=5.13",
  "pre-commit>=4.0",
  "ruff>=0.8",
]
test = [
  "pytest>=7.4",
]

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
wheel.packages = ["sparkmobility"]
wheel.exclude = [
  "sparkmobility/models/timegeo/_native/module_2_3_1.cpp",
]

[tool.cibuildwheel]
# Build only CPython 3.11+ on Linux (x86_64) and macOS (arm64). Windows is
# excluded because module_2_3_1.cpp uses POSIX-only headers. musllinux is
# also excluded — Arrow/Parquet wheels on musllinux are not well-tested.
build = ["cp311-*", "cp312-*", "cp313-*"]
skip = ["*-musllinux_*", "*-win*", "*-manylinux_i686"]
build-verbosity = 1

# After repair, import sparkmobility to load native deps (libarrow, etc.)
# would pull in the full Python dep graph (pyspark, pyarrow, geopandas...)
# which isn't the point of this test. Just assert the binary was installed
# next to runner.py and is executable.
test-command = """python -c "
import os, sys
for p in sys.path:
    b = os.path.join(p, 'sparkmobility', 'models', 'timegeo', '_native', 'module_2_3_1')
    if os.path.isfile(b):
        assert os.access(b, os.X_OK), f'not executable: {b}'
        print('binary OK:', b, os.path.getsize(b), 'bytes')
        break
else:
    sys.exit('module_2_3_1 binary missing from installed wheel')
" """

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
# Install Arrow / Parquet / Snappy from conda-forge via micromamba. Build
# H3 from upstream source because conda-forge's h3 CMake config ships an
# absolute path into its build-sandbox sysroot (.../libm.so), which
# Ninja trips over outside that sandbox. OpenMP + libstdc++ come from
# the manylinux image's GCC 11+ toolchain.
before-all = """
curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xvj -C /tmp bin/micromamba
/tmp/bin/micromamba create -y -r /tmp/mm -n build -c conda-forge \
    libarrow libparquet snappy
git clone --depth 1 -b v4.2.1 https://github.com/uber/h3.git /tmp/h3src
cmake -S /tmp/h3src -B /tmp/h3src/build -DCMAKE_INSTALL_PREFIX=/tmp/h3 \
    -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
cmake --build /tmp/h3src/build --target install -j
"""
environment = { CMAKE_ARGS = "-DCMAKE_PREFIX_PATH=/tmp/mm/envs/build;/tmp/h3", LD_LIBRARY_PATH = "/tmp/mm/envs/build/lib:/tmp/h3/lib64:/tmp/h3/lib" }
# auditwheel resolves + bundles libarrow / libparquet / libh3 / libsnappy
# into sparkmobility.libs/ with rpath rewrites.
repair-wheel-command = "LD_LIBRARY_PATH=/tmp/mm/envs/build/lib:/tmp/h3/lib64:/tmp/h3/lib auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64"]
# Deployment target pinned to 14.0 -- brew only ships current-OS bottles
# on macos-14 runners, so Arrow and friends require >=14.0. Dropping to
# 11.0 would need building brew deps from source, which isn't worth it.
before-all = "brew install apache-arrow h3 snappy libomp"
environment = { CMAKE_PREFIX_PATH = "/opt/homebrew", MACOSX_DEPLOYMENT_TARGET = "14.0" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
