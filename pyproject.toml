[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "sparkmobility"
version = "0.1.0"
description = "Human mobility modeling with Spark and the TimeGeo simulator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

authors = [
  { name = "Shangqing Cao", email = "caoalbert@berkeley.edu" }
]

dependencies = [
  "branca>=0.7",
  "censusdis>=1.4.0",
  "folium>=0.20.0",
  "geopandas>=1.0.1",
  "geopy>=2.4.1",
  "h3>=4.1",
  "h3spark>=0.0.4",
  "matplotlib>=3.8.4",
  "numpy>=1.26.4",
  "pandas>=2.2",
  "powerlaw>=1.5",
  "pyarrow>=14.0.2",
  "pyproj>=3.6.1",
  "pyspark>=3.5.1",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "seaborn>=0.13",
  "shapely>=2.0",
  "statsmodels>=0.14.4",
  "tqdm>=4.66.4",
]

[project.optional-dependencies]
dev = [
  "black>=24.10",
  "isort>=5.13",
  "pre-commit>=4.0",
  "ruff>=0.8",
]
test = [
  "pytest>=7.4",
]

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
wheel.packages = ["sparkmobility"]
wheel.exclude = [
  "sparkmobility/models/timegeo/_native/module_2_3_1.cpp",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
